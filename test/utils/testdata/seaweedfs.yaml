---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: seaweedfs
  name: seaweedfs
  namespace: thanos-operator-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: thanos-operator-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      securityContext:
        # The image runs as the non-root 'seaweed' user, which needs to own /data.
        fsGroup: 1000
      containers:
        - args:
            # Only the S3 gateway is used, so WebDAV, the Iceberg/Lance catalogs and
            # the admin UI are turned off. The 'thanos' bucket is pre-created rather
            # than auto-created on first upload, so the store behaves like real S3.
            - mini
            - -dir=/data
            - -s3.port=8333
            - -webdav=false
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -s3.autoCreateBucket=false
            - -admin.ui=false
            - -bucket=thanos
          env:
            - name: AWS_ACCESS_KEY_ID
              value: 'thanos'
            - name: AWS_SECRET_ACCESS_KEY
              value: 'thanos-secret'
          image: chrislusf/seaweedfs:4.47
          name: seaweedfs
          ports:
            - containerPort: 8333
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8333
            periodSeconds: 2
            timeoutSeconds: 2
          volumeMounts:
            - mountPath: /data
              name: storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: seaweedfs
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: thanos-operator-system
spec:
  ports:
    - port: 8333
      protocol: TCP
      targetPort: 8333
  selector:
    app.kubernetes.io/name: seaweedfs
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-test
  namespace: thanos-operator-system
stringData:
  endpoint: 'http://seaweedfs.thanos-operator-system.svc:8333'
  bucket: 'thanos'
  access_key_id: 'thanos'
  access_key_secret: 'thanos-secret'
type: Opaque
