kind: Secret
apiVersion: v1
metadata:
  name: thanos-object-storage
  namespace: thanos-operator-system
stringData:
  thanos.yaml: |
    type: S3
    config:
      bucket: "thanos"
      access_key: "thanos"
      secret_key: "thanos-secret"
      endpoint: "seaweedfs.thanos-operator-system.svc:8333"
      insecure: true
      trace:
        enable: false
type: Opaque
