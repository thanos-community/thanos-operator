apiVersion: montioring.rhobs/v1
kind: ServiceMonitor
metadata:
  labels:
    some-random-label: some-random
  name: thanos-stack
  namespace: ns
spec:
  endpoints:
  - path: /metrics
    port: http
  namespaceSelector:
    matchNames:
    - ns
  selector:
    matchLabels:
      some-random-selector-label: some-random
